<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Paradigm Calculator & Converter</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-wrapper" id="app-wrapper">
        <div class="tab-navigation">
            <button class="tab-btn active" id="calc-tab-btn">Calculator</button>
            <button class="tab-btn" id="convert-tab-btn">Converter</button>
        </div>

        <div class="calculator-container">
            <div class="calculator-card">
                <div id="calc-tab" class="tab-content active">
                    <h2>Paradigm Calculator</h2>
                    <div class="paradigm-selector">
                        <select id="paradigmChoice" class="styled-select">
                            <option value="procedural">Procedural</option>
                            <option value="oop">Object-Oriented</option>
                            <option value="functional">Functional</option>
                        </select>
                    </div>
                    <div class="inputs">
                        <input type="text" id="expressionInput" placeholder="Enter expression">
                    </div>
                </div>

                <div id="convert-tab" class="tab-content">
                    <h2>Unit Converter</h2>
                    <div class="converter-group">
                        <select id="convertType" class="styled-select">
                            <option value="length">Length (m to ft)</option>
                            <option value="temp">Temp (°C to °F)</option>
                            <option value="weight">Weight (kg to lb)</option>
                        </select>
                    </div>
                    <div class="inputs">
                        <input type="text" id="convertInput" placeholder="0" readonly>
                    </div>
                </div>

                <div class="operators" id="numpad">
                    <button class="num-btn">7</button>
                    <button class="num-btn">8</button>
                    <button class="num-btn">9</button>
                    <button class="op-btn calc-only">÷</button>

                    <button class="num-btn">4</button>
                    <button class="num-btn">5</button>
                    <button class="num-btn">6</button>
                    <button class="op-btn calc-only">×</button>

                    <button class="num-btn">1</button>
                    <button class="num-btn">2</button>
                    <button class="num-btn">3</button>
                    <button class="op-btn calc-only">−</button>

                    <button class="num-btn">0</button>
                    <button class="num-btn">.</button>
                    <button class="op-btn calc-only">%</button>
                    <button class="op-btn calc-only">+</button>

                    <button class="op-btn calc-only">(</button>
                    <button class="op-btn calc-only">)</button>
                    <button class="btn-delete">DEL</button>
                    <button class="btn-ans calc-only">ANS</button>
                </div>

                <div class="utility-buttons">
                    <button class="btn-clear">AC</button>
                    <button class="btn-equal">=</button>
                </div>

                <div id="resultDisplay" class="result">Result: --</div>
            </div>

            <div class="history-card">
                <h2>History</h2>
                <ul id="historyList"></ul>
                <button class="btn-history-clear">Clear</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
